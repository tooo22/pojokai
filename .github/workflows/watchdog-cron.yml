name: PojokAI 5-Minute Watchdog Trigger

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger PojokAI Watchdog Audit
        run: |
          CRON_TOKEN="${{ secrets.CRON_SECRET || 'pojokai-cron-secret-key-2026' }}"
          curl -s -f -H "Authorization: Bearer $CRON_TOKEN" "https://pojokai.my.id/api/cron/monitor" || echo "Ping dispatched"
